name: Deploy to GitHub Pages

# Déploie la démo statique sur GitHub Pages à chaque push sur `main`.
# Prérequis (une seule fois) : dans Settings → Pages du repo, choisir
# « Source : GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi un déclenchement manuel

# Permissions nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (export statique, mode mock)
        env:
          # Base path = "/<nom-du-repo>" pour un site projet Pages.
          # Pour un site utilisateur (<user>.github.io), laissez vide : ""
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DATA_MODE: mock
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
